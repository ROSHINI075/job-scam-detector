{% extends "layout.html" %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8 text-center mb-5">
            <h1 class="hero-title animate-fade-in">Resume <span class="accent-text">Strength Analysis</span></h1>
            <p class="text-secondary">Upload your resume to see how well it matches your target role.</p>
        </div>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="glass-card p-5 animate-fade-in">
                <form action="{{ url_for('ml.analyze_resume') }}" method="POST" enctype="multipart/form-data">
                    <div class="mb-4">
                        <label for="role" class="form-label fw-bold">Select Target Role</label>
                        <select class="form-select bg-dark text-white border-secondary" id="role" name="role" required>
                            <option value="" disabled selected>Choose a role...</option>
                            {% for role in roles %}
                            <option value="{{ role }}">{{ role }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-4">
                        <label for="resume" class="form-label fw-bold">Upload Resume (PDF or DOCX)</label>
                        <input type="file" class="form-control bg-dark text-white border-secondary" id="resume"
                            name="resume" accept=".pdf,.docx" required>
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary py-3">
                            <i class="fas fa-magic me-2"></i>Analyze My Resume
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
