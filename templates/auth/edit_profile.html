{% extends "layout.html" %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center pt-5">
        <div class="col-md-6">
            <div class="glass-card p-5 animate-fade-in">
                <div class="text-center mb-4">
                    <h2 class="fw-bold">Edit Profile</h2>
                    <p class="text-secondary">Update your personal information</p>
                </div>
                <form method="POST" action="">
                    <div class="mb-3">
                        <label class="form-label small text-secondary">Username</label>
                        <input type="text" name="username" class="form-control bg-dark border-secondary text-white"
                            value="{{ current_user.username }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small text-secondary">Email Address (Read-only)</label>
                        <input type="email" class="form-control bg-dark border-secondary text-white"
                            value="{{ current_user.email }}" readonly disabled>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small text-secondary">Profession / Job Role</label>
                        <input type="text" name="profession" class="form-control bg-dark border-secondary text-white"
                            value="{{ current_user.profession }}" placeholder="e.g. Software Developer">
                    </div>
                    <div class="mb-4 form-check form-switch">
                        <input class="form-check-input bg-dark border-secondary" type="checkbox" name="notifications"
                            id="notifSwitch" {{ 'checked' if current_user.notifications_enabled else '' }}>
                        <label class="form-check-label small text-secondary" for="notifSwitch">Enable job related
                            notifications</label>
                    </div>
                    <div class="d-flex gap-3">
                        <a href="{{ url_for('main.dashboard') }}" class="btn btn-outline-light w-100 py-2">Cancel</a>
                        <button type="submit" class="btn btn-primary w-100 py-2">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
