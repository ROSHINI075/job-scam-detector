{% extends "layout.html" %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center pt-5">
        <div class="col-md-5">
            <div class="glass-card p-5 animate-fade-in">
                <div class="text-center mb-4">
                    <h2 class="fw-bold">Create Account</h2>
                    <p class="text-secondary">Join ScamShield to start verifying offers</p>
                </div>
                <form method="POST" action="">
                    <div class="mb-3">
                        <label class="form-label small text-secondary">Username</label>
                        <input type="text" name="username" class="form-control bg-dark border-secondary text-white"
                            placeholder="Choose a username" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small text-secondary">Email Address</label>
                        <input type="email" name="email" class="form-control bg-dark border-secondary text-white"
                            placeholder="name@example.com" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small text-secondary">Password</label>
                        <input type="password" name="password" class="form-control bg-dark border-secondary text-white"
                            placeholder="••••••••" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label small text-secondary">Profession / Job Role</label>
                        <input type="text" name="profession" class="form-control bg-dark border-secondary text-white"
                            placeholder="e.g. Software Developer">
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 mb-3">Sign Up</button>
                    <div class="text-center">
                        <span class="small text-secondary">Already have an account? <a
                                href="{{ url_for('auth.login') }}" class="accent-text text-decoration-none">Log
                                In</a></span>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
